# NGINX de la instancia: reverse proxy del monolito + API gateway de los microservicios.
# Se instala como /etc/nginx/conf.d/library.conf (ver instalar_nginx.sh).
#
#   http://<IP>/                  -> redirige al monolito
#   http://<IP>/library/...       -> monolito (Node :3000)
#   http://<IP>/api/auth/...      -> login      :5000   (se quita el prefijo /api/auth: /api/auth/login -> /login)
#   http://<IP>/api/libros...     -> libros     :5001
#   http://<IP>/api/users, /api/roles -> users  :5002
#   http://<IP>/api/authors...    -> authors    :5003
#   http://<IP>/api/pedidos...    -> pedidos    :5004
#   http://<IP>/api/pagos...      -> pagos      :5005
#   ws://<IP>/ws/rastreo          -> tracking   :5006 (WebSocket)
#   http://<IP>/health/<servicio> -> /health de cada servicio
# Los servicios siguen validando el JWT por su cuenta: el gateway solo enruta, limita y centraliza.

# WebSocket: Connection "upgrade" solo cuando el cliente pide Upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Servicio -> puerto, para /health/<servicio>
map $svc $svc_port {
    login 5000;  libros 5001;  users 5002;  authors 5003;  pedidos 5004;  pagos 5005;  tracking 5006;
}

# Freno a fuerza bruta sobre el login (10 intentos por minuto por IP, con rafaga de 5)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;             # multer sube imagenes de libros (el limite por defecto, 1 MB, las rechazaria)

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # ---------- Monolito ----------
    location = / {
        return 302 /library/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000; # sin barra final: se conserva la URI completa (BASE_PATH=/library)
    }

    # ---------- Gateway de microservicios ----------
    # Login: la barra final de proxy_pass QUITA el prefijo /api/auth/.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:5000/;
    }
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/login;
    }
    location = /api/auth/login/verify {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/login/verify;
    }

    # Sin barra final: se conserva la ruta completa (los servicios ya publican /api/...)
    location /api/libros   { proxy_pass http://127.0.0.1:5001; }
    location /api/users    { proxy_pass http://127.0.0.1:5002; }
    location /api/roles    { proxy_pass http://127.0.0.1:5002; }
    location /api/authors  { proxy_pass http://127.0.0.1:5003; }
    location /api/pedidos  { proxy_pass http://127.0.0.1:5004; }
    location /api/pagos    { proxy_pass http://127.0.0.1:5005; }

    # Rastreo por WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;         # la conexion vive mientras dura el recorrido
        proxy_send_timeout 3600s;
    }

    # Estado de cada servicio: /health/pedidos, /health/login, ...
    location ~ ^/health/(?<svc>login|libros|users|authors|pedidos|pagos|tracking)$ {
        proxy_pass http://127.0.0.1:$svc_port/health;
    }
}
