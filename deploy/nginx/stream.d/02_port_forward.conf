# 2) PORT FORWARD (TCP, modulo stream) -> /etc/nginx/stream.d/02_port_forward.conf
# NGINX reenvia bytes TCP sin interpretar HTTP: lo que entra por el puerto publico sale tal cual
# hacia el puerto interno. Sirve para exponer un servicio concreto sin pasar por las reglas HTTP del gateway.
# Este archivo va en el contexto "stream" (NO en conf.d, que es "http"); instalar_nginx.sh agrega
# "include /etc/nginx/stream.d/*.conf;" a nginx.conf.
#
#   :15001 -> 127.0.0.1:5001   (libros, acceso directo)
#   :15004 -> 127.0.0.1:5004   (pedidos)
#   :15005 -> 127.0.0.1:5005   (pagos)

server {
    listen 15001;
    proxy_pass 127.0.0.1:5001;
    proxy_connect_timeout 5s;
}
server {
    listen 15004;
    proxy_pass 127.0.0.1:5004;
    proxy_connect_timeout 5s;
}
server {
    listen 15005;
    proxy_pass 127.0.0.1:5005;
    proxy_connect_timeout 5s;
}
