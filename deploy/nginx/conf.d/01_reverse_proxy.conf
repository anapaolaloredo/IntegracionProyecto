# 1) REVERSE PROXY (HTTP :80 y HTTPS :443) -> /etc/nginx/conf.d/01_reverse_proxy.conf
# Una sola entrada publica; NGINX decide a que servidor interno va cada ruta.
#
#   /                      -> 302 /library/
#   /library/...           -> monolito (Node :3000)
#   /api/auth/...          -> login   :5000 (se quita el prefijo: /api/auth/login -> /login)
#   /api/books/...         -> libros  :5001 (PREFIJO /api/books/ -> /api/libros/: /api/books/book -> /api/libros/book)
#   /api/libros...         -> libros  :5001 (ruta original, sigue valida)
#   /api/users, /api/roles -> users   :5002
#   /api/authors...        -> authors :5003
#   /api/pedidos...        -> pedidos :5004
#   /api/pagos...          -> pagos   :5005
#   /health/<servicio>     -> /health de cada servicio
# Los servicios siguen validando el JWT; el gateway solo enruta, limita y centraliza.
# El port forward TCP esta en stream.d/02_port_forward.conf y los WebSockets en conf.d/03_websocket.conf.

map $svc $svc_port {
    login 5000;  libros 5001;  users 5002;  authors 5003;  pedidos 5004;  pagos 5005;  tracking 5006;
}

# Freno a fuerza bruta sobre el login (10 intentos por minuto por IP, rafaga de 5)
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTPS: mismo servidor y mismas rutas por el 443 (certificado: ./crear_certificado.sh <host>)
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/library.crt;
    ssl_certificate_key /etc/nginx/ssl/library.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;             # multer sube imagenes de libros

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # ---------- Monolito ----------
    location = / { return 302 /library/; }
    location /    { proxy_pass http://127.0.0.1:3000; }   # sin barra final: conserva /library

    # ---------- Login: la barra final de proxy_pass QUITA el prefijo /api/auth/ ----------
    location /api/auth/ { proxy_pass http://127.0.0.1:5000/; }
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/login;
    }
    location = /api/auth/login/verify {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000/login/verify;
    }

    # ---------- Libros: prefijo /api/books ----------
    # /api/books        -> /api/libros
    # /api/books/book   -> /api/libros/book   (el prefijo se reescribe, el resto de la ruta se conserva)
    location = /api/books { proxy_pass http://127.0.0.1:5001/api/libros$is_args$args; }
    location /api/books/  { proxy_pass http://127.0.0.1:5001/api/libros/; }
    location /api/libros  { proxy_pass http://127.0.0.1:5001; }

    # ---------- Resto de servicios (sin barra final: se conserva la ruta completa) ----------
    location /api/users    { proxy_pass http://127.0.0.1:5002; }
    location /api/roles    { proxy_pass http://127.0.0.1:5002; }
    location /api/authors  { proxy_pass http://127.0.0.1:5003; }
    location /api/pedidos  { proxy_pass http://127.0.0.1:5004; }
    location /api/pagos    { proxy_pass http://127.0.0.1:5005; }

    # Estado de cada servicio: /health/pedidos, /health/login, ...
    location ~ ^/health/(?<svc>login|libros|users|authors|pedidos|pagos|tracking)$ {
        proxy_pass http://127.0.0.1:$svc_port/health;
    }
}
