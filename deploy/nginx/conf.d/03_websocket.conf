# 3) WEBSOCKETS EXCLUSIVOS (puerto 8090) -> /etc/nginx/conf.d/03_websocket.conf
# Servidor dedicado solo a WebSocket: cualquier ruta que no sea /ws/ responde 404 y una peticion
# HTTP normal a /ws/ (sin Upgrade) responde 426. Las conexiones largas del rastreo no comparten
# timeouts ni limites con la API.
#
#   ws://<IP>:8090/ws/rastreo  y  wss://<IP>:8443/ws/rastreo -> tracking :5006

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    listen [::]:8090;
    listen 8443 ssl;                 # wss://<IP>:8443/ws/rastreo (mismo certificado que :443)
    listen [::]:8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/library.crt;
    ssl_certificate_key /etc/nginx/ssl/library.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /ws/ {
        if ($http_upgrade != "websocket") { return 426; }   # exclusivo: solo handshakes WebSocket
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;       # la conexion vive mientras dura el recorrido
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
